name: Three-Tier Frontend CI/CD

# Start the workflow when frontend code changes on main
on:
  push:
    branches:
      - main
    paths:
      - "Application-Code/frontend/**"
      - ".github/workflows/frontend-cicd.yml"

  # Run CI checks for pull requests targeting main
  pull_request:
    branches:
      - main
    paths:
      - "Application-Code/frontend/**"
      - ".github/workflows/frontend-cicd.yml"

  # Allow manual execution from the GitHub Actions page
  workflow_dispatch:

# Common variables available to all jobs
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: three-tier-frontend
  IMAGE_TAG: ${{ github.sha }}
  FRONTEND_DIRECTORY: Application-Code/frontend
  MANIFEST_FILE: Kubernetes-Manifests-file/Frontend/deployment.yaml

jobs:

  # ============================================================
  # JOB 1: Install, test, build and scan frontend source code
  # ============================================================
  ci:
    name: Install, Test, SonarQube and Trivy
    runs-on: self-hosted

    steps:

      # Download the repository onto the EC2 self-hosted runner
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Node.js and enable npm dependency caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Application-Code/frontend/package-lock.json

      # Install exact dependencies from package-lock.json
      - name: Install Dependencies
        working-directory: ${{ env.FRONTEND_DIRECTORY }}
        run: npm ci

      # Run frontend tests once without watch mode
      # Pass successfully when the project currently has no tests
      - name: Test Frontend
        working-directory: ${{ env.FRONTEND_DIRECTORY }}
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests

      # Create the production frontend build
      - name: Build Frontend
        working-directory: ${{ env.FRONTEND_DIRECTORY }}
        env:
          CI: true
        run: npm run build --if-present

      # Send frontend source code to SonarQube
      - name: SonarQube Code Analysis
        working-directory: ${{ env.FRONTEND_DIRECTORY }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          npx --yes sonar-scanner \
            -Dsonar.projectKey=three-tier-frontend \
            -Dsonar.projectName=three-tier-frontend \
            -Dsonar.sources=src \
            -Dsonar.exclusions="node_modules/**,build/**,dist/**,coverage/**" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

      # Scan frontend files and dependencies for vulnerabilities
      # exit-code 0 reports issues without stopping the pipeline
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: Application-Code/frontend
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  # ============================================================
  # JOB 2: Build the Docker image and push it to Amazon ECR
  # ============================================================
  docker-push:
    name: Build Docker Image and Push to ECR
    needs: ci

    # Do not create or push images during pull-request checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: self-hosted

    outputs:
      full-image: ${{ steps.image.outputs.full-image }}

    steps:

      # Download source code for the Docker build
      - name: Checkout Code
        uses: actions/checkout@v4

      # Confirm the IAM role attached to the EC2 runner is working
      - name: Check AWS Identity
        run: aws sts get-caller-identity

      # Authenticate Docker with ECR through the EC2 IAM role
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          region: ${{ env.AWS_REGION }}

      # Create the full Docker image URL
      # Example: account.dkr.ecr.us-east-1.amazonaws.com/repository:commit-id
      - name: Set Image Name
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "FULL_IMAGE=${FULL_IMAGE}" >> "$GITHUB_ENV"
          echo "full-image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"

      # Build the image using the frontend Dockerfile
      - name: Build Docker Image
        working-directory: ${{ env.FRONTEND_DIRECTORY }}
        run: docker build --tag "$FULL_IMAGE" .

      # Push the frontend image into Amazon ECR
      - name: Push Image to Amazon ECR
        run: docker push "$FULL_IMAGE"

  # ============================================================
  # JOB 3: Update the Kubernetes deployment image
  # ============================================================
  update-manifest:
    name: Update Kubernetes Deployment YAML
    needs: docker-push
    runs-on: self-hosted

    # Permit the automatic GITHUB_TOKEN to push the YAML change
    permissions:
      contents: write

    steps:

      # Get the latest main branch before changing the manifest
      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Replace the old image value with the new ECR image
      - name: Update Frontend Image
        env:
          FULL_IMAGE: ${{ needs.docker-push.outputs.full-image }}
        run: |
          sed -i -E \
            "s|(^[[:space:]]*image:[[:space:]]*).*$|\1${FULL_IMAGE}|" \
            "$MANIFEST_FILE"

          grep "image:" "$MANIFEST_FILE"

      # Commit only when deployment.yaml has actually changed
      - name: Commit and Push Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$MANIFEST_FILE"

          if git diff --cached --quiet; then
            echo "No manifest change"
          else
            git commit -m "Update frontend image to ${IMAGE_TAG} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
