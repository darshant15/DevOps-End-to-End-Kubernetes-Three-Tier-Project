name: Three-Tier Frontend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: three-tier-frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:

      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Application-Code/frontend/package-lock.json

      # 3. Install dependencies
      - name: Install Dependencies
        working-directory: Application-Code/frontend
        run: npm ci

      # 4. SonarQube Analysis
      - name: SonarQube Analysis
        working-directory: Application-Code/frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          npx sonar-scanner \
            -Dsonar.projectKey=three-tier-frontend \
            -Dsonar.projectName=three-tier-frontend \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN

      # 5. OWASP Dependency Check
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "three-tier-frontend"
          path: "Application-Code/frontend"
          format: "HTML"
          out: "reports"

      # 6. Trivy filesystem scan
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: Application-Code/frontend
          format: table
          exit-code: '0'

      # 7. Build Docker image
      - name: Build Docker Image
        working-directory: Application-Code/frontend
        run: |
          docker build \
            -t ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .

      # 8. Trivy Docker image scan
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}'
          format: table
          exit-code: '0'

      # 9. AWS authentication using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 10. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 11. Push Docker image to ECR
      - name: Push Docker Image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag \
            ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

          docker push \
            $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      # 12. Update frontend Kubernetes deployment
      - name: Update Kubernetes Deployment
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          cd Kubernetes-Manifests-file/Frontend

          sed -i \
            "s|\(frontend:\)[^ ]*|\1${IMAGE_TAG}|" \
            deployment.yaml

      # 13. Commit deployment change
      - name: Commit Deployment Change
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add Kubernetes-Manifests-file/Frontend/deployment.yaml

          git commit \
            -m "Update frontend image to ${{ env.IMAGE_TAG }}" \
            || echo "No changes to commit"

          git push
