name: Three-Tier Backend CI/CD

# Run pipeline when backend code changes on main branch
on:
  push:
    branches:
      - main
    paths:
      - "Application-Code/backend/**"
      - ".github/workflows/backend-cicd.yml"

  # Run CI validation for pull requests to main
  pull_request:
    branches:
      - main
    paths:
      - "Application-Code/backend/**"
      - ".github/workflows/backend-cicd.yml"

  # Allow pipeline to be started manually
  workflow_dispatch:

# Common variables used by all jobs
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: three-tier-backend
  IMAGE_TAG: ${{ github.sha }}
  BACKEND_DIRECTORY: Application-Code/backend
  MANIFEST_FILE: Kubernetes-Manifests-file/Backend/deployment.yaml

jobs:

  # ============================================================
  # JOB 1: Install, test, build and scan backend source code
  # ============================================================
  ci:
    name: Install, Test, SonarQube and Trivy
    runs-on: self-hosted

    steps:

      # Download repository code into the EC2 runner
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Node.js and enable npm dependency caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Application-Code/backend/package-lock.json

      # Install exact dependency versions from package-lock.json
      - name: Install Dependencies
        working-directory: ${{ env.BACKEND_DIRECTORY }}
        run: npm ci

      # Run tests only when a real test command is configured
      - name: Test Backend
        working-directory: ${{ env.BACKEND_DIRECTORY }}
        shell: bash
        run: |
          TEST_SCRIPT=$(node -p "require('./package.json').scripts?.test || ''")

          if [ -z "$TEST_SCRIPT" ] || [[ "$TEST_SCRIPT" == *"no test specified"* ]]; then
            echo "No backend automated tests configured; skipping tests"
          else
            npm test
          fi

      # Build the backend when package.json contains a build script
      - name: Build Backend
        working-directory: ${{ env.BACKEND_DIRECTORY }}
        run: npm run build --if-present

      # Send source code to SonarQube for quality analysis
      - name: SonarQube Code Analysis
        working-directory: ${{ env.BACKEND_DIRECTORY }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          npx --yes sonar-scanner \
            -Dsonar.projectKey=three-tier-backend \
            -Dsonar.projectName=three-tier-backend \
            -Dsonar.sources=. \
            -Dsonar.exclusions="node_modules/**,coverage/**" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

      # Check backend files and dependencies for vulnerabilities
      # exit-code 0 reports issues but does not fail the pipeline
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: Application-Code/backend
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  # ============================================================
  # JOB 2: Build Docker image and push it to Amazon ECR
  # ============================================================
  docker-push:
    name: Build Docker Image and Push to ECR
    needs: ci

    # Do not push Docker images during pull-request validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: self-hosted

    outputs:
      full-image: ${{ steps.image.outputs.full-image }}

    steps:

      # Download the source code for Docker build
      - name: Checkout Code
        uses: actions/checkout@v4

      # Confirm that the EC2 instance IAM role is available
      - name: Check AWS Identity
        run: aws sts get-caller-identity

      # Login Docker to ECR using the IAM role attached to EC2
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          region: ${{ env.AWS_REGION }}

      # Create the complete ECR image name
      # Example: account.dkr.ecr.us-east-1.amazonaws.com/repository:commit-id
      - name: Set Image Name
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "FULL_IMAGE=${FULL_IMAGE}" >> "$GITHUB_ENV"
          echo "full-image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"

      # Build the Docker image using the backend Dockerfile
      - name: Build Docker Image
        working-directory: ${{ env.BACKEND_DIRECTORY }}
        run: docker build --tag "$FULL_IMAGE" .

      # Push the newly built image to Amazon ECR
      - name: Push Image to Amazon ECR
        run: docker push "$FULL_IMAGE"

  # ============================================================
  # JOB 3: Update the Kubernetes deployment image
  # ============================================================
  update-manifest:
    name: Update Kubernetes Deployment YAML
    needs: docker-push
    runs-on: self-hosted

    # Allow GITHUB_TOKEN to push the manifest change
    permissions:
      contents: write

    steps:

      # Get the latest main branch before modifying the manifest
      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Replace the existing image value with the new ECR image
      - name: Update Backend Image
        env:
          FULL_IMAGE: ${{ needs.docker-push.outputs.full-image }}
        run: |
          sed -i -E \
            "s|(^[[:space:]]*image:[[:space:]]*).*$|\1${FULL_IMAGE}|" \
            "$MANIFEST_FILE"

          grep "image:" "$MANIFEST_FILE"

      # Commit and push only when the manifest actually changed
      - name: Commit and Push Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$MANIFEST_FILE"

          if git diff --cached --quiet; then
            echo "No manifest change"
          else
            git commit -m "Update backend image to ${IMAGE_TAG} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
