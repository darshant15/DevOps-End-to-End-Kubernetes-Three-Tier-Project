name: Three-Tier Backend CI/CD

# Run only one backend pipeline per branch at a time
concurrency:
  group: backend-cicd-${{ github.ref }}
  cancel-in-progress: true

# Pipeline triggers
on:
  # Run when backend code or this workflow changes on main
  push:
    branches:
      - main
    paths:
      - "Application-Code/backend/**"
      - ".github/workflows/backend-cicd.yml"

  # Run CI validation for pull requests targeting main
  pull_request:
    branches:
      - main
    paths:
      - "Application-Code/backend/**"
      - ".github/workflows/backend-cicd.yml"

  # Allow manual pipeline execution
  workflow_dispatch:

# Default permission for jobs
permissions:
  contents: read

# Common environment variables
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: three-tier-backend
  IMAGE_TAG: ${{ github.sha }}
  BACKEND_DIRECTORY: Application-Code/backend
  MANIFEST_FILE: Kubernetes-Manifests-file/Backend/deployment.yaml

jobs:

  # ============================================================
  # JOB 1: Install, test, build and scan backend source code
  # ============================================================

  ci:
    name: Install, Test, SonarQube and Trivy
    runs-on: self-hosted

    steps:

      # Download repository code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Node.js and enable npm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Application-Code/backend/package-lock.json

      # Install exact dependency versions
      - name: Install Dependencies
        working-directory: ${{ env.BACKEND_DIRECTORY }}
        run: npm ci

      # Run tests only when a valid test command is configured
      - name: Test Backend
        working-directory: ${{ env.BACKEND_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          TEST_SCRIPT=$(node -p "require('./package.json').scripts?.test || ''")

          if [ -z "$TEST_SCRIPT" ] || [[ "$TEST_SCRIPT" == *"no test specified"* ]]; then
            echo "No backend automated tests configured; skipping tests"
          else
            npm test
          fi

      # Run build only when package.json contains a build script
      - name: Build Backend
        working-directory: ${{ env.BACKEND_DIRECTORY }}
        run: npm run build --if-present

      # Verify SonarQube connectivity and analyze backend code
      - name: SonarQube Code Analysis
        working-directory: ${{ env.BACKEND_DIRECTORY }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -euo pipefail

          if [ -z "${SONAR_HOST_URL:-}" ]; then
            echo "ERROR: SONAR_HOST_URL secret is missing"
            exit 1
          fi

          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "ERROR: SONAR_TOKEN secret is missing"
            exit 1
          fi

          echo "Checking SonarQube server..."

          curl --fail --silent --show-error \
            "${SONAR_HOST_URL}/api/system/status"

          echo
          echo "Starting SonarQube analysis..."

          npx --yes sonar-scanner \
            -Dsonar.projectKey=three-tier-backend \
            -Dsonar.projectName=three-tier-backend \
            -Dsonar.sources=. \
            -Dsonar.exclusions="node_modules/**,coverage/**" \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.login="${SONAR_TOKEN}"

      # Scan backend files and dependencies for vulnerabilities
      # exit-code 0 reports vulnerabilities without failing the job
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: Application-Code/backend
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  # ============================================================
  # JOB 2: Build Docker image and push it to Amazon ECR
  # ============================================================

  docker-push:
    name: Build Docker Image and Push to ECR
    needs: ci
    runs-on: self-hosted

    # Do not build or push an image during pull-request validation
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    outputs:
      full-image: ${{ steps.image.outputs.full-image }}

    steps:

      # Download repository code for the Docker build
      - name: Checkout Code
        uses: actions/checkout@v4

      # Verify the IAM role attached to the EC2 runner
      - name: Check AWS Identity
        run: aws sts get-caller-identity

      # Authenticate Docker with Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.1
        with:
          region: ${{ env.AWS_REGION }}

      # Create the complete ECR image name
      - name: Set Image Name
        id: image
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "FULL_IMAGE=${FULL_IMAGE}" >> "$GITHUB_ENV"
          echo "full-image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"

          echo "Docker image: ${FULL_IMAGE}"

      # Build the backend Docker image
      - name: Build Docker Image
        working-directory: ${{ env.BACKEND_DIRECTORY }}
        run: docker build --tag "$FULL_IMAGE" .

      # Scan the built Docker image
      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.full-image }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      # Push the Docker image to Amazon ECR
      - name: Push Image to Amazon ECR
        run: docker push "$FULL_IMAGE"

  # ============================================================
  # JOB 3: Update the Kubernetes deployment image
  # ============================================================

  update-manifest:
    name: Update Kubernetes Deployment YAML
    needs: docker-push
    runs-on: self-hosted

    # Allow this job to push the manifest commit
    permissions:
      contents: write

    steps:

      # Checkout the latest main branch
      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Make sure the local branch is up to date
      - name: Pull Latest Main Branch
        run: git pull --ff-only origin main

      # Replace the first image entry in the deployment manifest
      - name: Update Backend Image
        shell: bash
        env:
          FULL_IMAGE: ${{ needs.docker-push.outputs.full-image }}
        run: |
          set -euo pipefail

          if [ -z "${FULL_IMAGE:-}" ]; then
            echo "ERROR: Docker image output is empty"
            exit 1
          fi

          if [ ! -f "$MANIFEST_FILE" ]; then
            echo "ERROR: Manifest file not found: $MANIFEST_FILE"
            exit 1
          fi

          sed -i -E \
            "0,/^[[:space:]]*image:[[:space:]]*/s|(^[[:space:]]*image:[[:space:]]*).*$|\1${FULL_IMAGE}|" \
            "$MANIFEST_FILE"

          echo "Updated Kubernetes image:"
          grep "image:" "$MANIFEST_FILE"

      # Commit and push only when the manifest changed
      - name: Commit and Push Manifest
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$MANIFEST_FILE"

          if git diff --cached --quiet; then
            echo "No manifest change detected"
          else
            git commit -m "Update backend image to ${IMAGE_TAG} [skip ci]"
            git push origin main
          fi
